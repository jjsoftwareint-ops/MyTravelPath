<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>My Travel Path</title>
    <meta name="description" content="Free walking routes for travellers in Korea: Seoul, Busan, Jeju and Incheon. Each path opens in Google My Maps, with Naver Map links for every stop." />
    <link rel="canonical" href="https://jjsoftwareint-ops.github.io/MyTravelPath/" />
    <!-- Link previews (Reddit, Facebook, KakaoTalk, WhatsApp, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My Travel Path" />
    <meta property="og:title" content="My Travel Path – free walking routes in Korea" />
    <meta property="og:description" content="Curated walks in Seoul, Busan, Jeju and Incheon: fortress walls, hanok villages, night walks, cherry blossoms, Olle trails. Opens in Google Maps and Naver Map. No sign-up." />
    <meta property="og:url" content="https://jjsoftwareint-ops.github.io/MyTravelPath/" />
    <meta property="og:image" content="https://jjsoftwareint-ops.github.io/MyTravelPath/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bukchon hanok rooftops with the Seoul skyline, and the My Travel Path icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Travel Path – free walking routes in Korea" />
    <meta name="twitter:description" content="Curated walks in Seoul, Busan, Jeju and Incheon. Opens in Google Maps and Naver Map. No sign-up." />
    <meta name="twitter:image" content="https://jjsoftwareint-ops.github.io/MyTravelPath/og.jpg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=5" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Travel Path" />
    <script>
      // Apply the saved light/dark choice before the first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
