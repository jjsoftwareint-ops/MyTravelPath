<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--app-head-->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=6" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/manifest.webmanifest?v=6" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Travel Path" />
    <!-- Google AdSense (publisher pub-4846752594884580); ads.txt in /assets carries the same ID -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4846752594884580"
     crossorigin="anonymous"></script>
    <script>
      // Old links used hash routes (/#/seoul/hanok-villages). Send them to the real page.
      if (location.hash.indexOf('#/') === 0) {
        var p = ('/' + location.hash.slice(2)).replace(/\/+$/, '') + '/';
        location.replace(p === '//' ? '/' : p);
      }
    </script>
    <script>
      // Apply the saved light/dark choice before the first paint (see src/theme.ts).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
